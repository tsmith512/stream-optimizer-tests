<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case: Retail</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="stylesheet" href="/style.css" type="text/css" />
</head>
<body>
  <main class="container">
    <nav>
      <ul>
        <li><strong>Transformations Scratchwork</strong></li>
      </ul>
      <ul>
        <li><a href="/">Alpha</a></li>
        <li><a href="/fit">Image Fit</a></li>
        <li><a href="/savemyplay">Case: Sports</a></li>
        <li><a href="/retail">Case: Retail</a></li>
      </ul>
    </nav>

    <h1>Sample Videos</h1>

    <article>
      <hgroup>
        <h2>Overview</h2>
      </hgroup>
      <form>
        <select name="file" id="file">
          <option value="">Select a Video</option>
          <option value="https://pub-9cf4bfca6e924401bd4ac87ca9174da6.r2.dev/i/web_MALM_3x4.mp4"> 8MB - web_MALM_3x4.mp4</option>
          <option value="https://pub-9cf4bfca6e924401bd4ac87ca9174da6.r2.dev/i/1432941_fe003565.mp4">159MB - 1432941_fe003565.mp4</option>
          <option value="https://pub-9cf4bfca6e924401bd4ac87ca9174da6.r2.dev/i/Love_for_KALLAX_-_1x1_Versatility_3D_animation.mp4">163MB - Love_for_KALLAX_-_1x1_Versatility_3D_animation.mp4</option>
          <option value="https://pub-9cf4bfca6e924401bd4ac87ca9174da6.r2.dev/i/Com25_PCAC_RAC-Bedroom-L1_ULLVIDE_23s_3x4.mp4">226MB - Com25_PCAC_RAC-Bedroom-L1_ULLVIDE_23s_3x4.mp4</option>
        </select>
      </form>
    </article>

    <article>
      <header>
        <hgroup>
          <h2>Drawer Unit</h2>
        </hgroup>
      </header>

      <video id="original" controls>
      </video>

    </article>

    <h3>Outputs</h3>

    <article>
      <header>
        <hgroup>
          <h4>Optimized</h4>
        </hgroup>
      </header>
      <video id="variant" controls>
      </video>
    </article>


    <article>
      <header>
        <hgroup>
          <h4>Still Frames</h4>
        </hgroup>
      </header>

      <div class="grid">
        <div>
          <img id="imgA" />
        </div>
        <div>
          <img id="imgB" />
        </div>
      </div>
    </article>

    <article>
      <header>
        <hgroup>
          <h4>Transformed Videos</h4>
        </hgroup>
      </header>
      <div class="grid">
        <div>
          <video id="square" controls>
          </video>
        </div>
        <div>
          <video id="vert" controls>
          </video>
        </div>
      </div>

    </article>
    <hr />
  </main>
  <script>
    fileEl = document.getElementById('file');
    originalEl = document.getElementById('original');
    variantEl = document.getElementById('variant');
    imgAEl = document.getElementById('imgA');
    imgBEl = document.getElementById('imgB');
    squareEl = document.getElementById('square');
    vertEl = document.getElementById('vert');

    const makeUrl = (url, options) => {
      if (options) {
        return `/cdn-cgi/media/${options}/${url}`;
      } else {
        return url;
      }

    };

    const makeSource = (url, options) => {
      const source = document.createElement('source');
      source.setAttribute('src', makeUrl(url, options));
      return source;
    };

    fileEl.addEventListener('change', e => {
      e.preventDefault();
      document.querySelectorAll('video').forEach(v => v.innerHTML = null);
      document.querySelectorAll('img').forEach(i => i.setAttribute('src', null));

      if (! fileEl.selectedOptions[0].value) {
        return;
      }

      const url = fileEl.selectedOptions[0].value;

      originalEl.appendChild(makeSource(url, null));
      variantEl.appendChild(makeSource(url, 'duration=5m,width=720'));
      squareEl.appendChild(makeSource(url, 'duration=5m,width=480,height=480,fit=cover'));
      vertEl.appendChild(makeSource(url, 'duration=5m,width=480,height=720,fit=cover'));
      document.querySelectorAll('video').forEach(v => v.load());

      imgAEl.setAttribute('src', makeUrl(url, 'mode=frame,time=10s,width=480,format=jpg'));
      imgBEl.setAttribute('src', makeUrl(url, 'mode=frame,time=10s,width=480,height=480,fit=cover,format=jpg'));

    });
  </script>
</body>
</html>
